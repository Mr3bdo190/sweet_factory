name: social_network_app
description: Full Social Media Application.
version: 2.0.0+2
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  timeago: ^3.7.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  image_picker:
  record: ^4.2.8
  audioplayers:
  cloudinary_public:
  http:
  firebase_storage: ^13.3.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  video_player: ^2.11.1
  file_picker: ^11.0.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  gal: ^2.3.2
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
